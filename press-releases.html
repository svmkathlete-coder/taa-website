<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Releases - Telangana Athletics Association</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0056b3;
            --accent: #FF8C00;
            --white: #ffffff;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            background: var(--bg-light); 
            color: var(--text-dark); 
            line-height: 1.6;
        }

        /* --- Page Header --- */
        .page-header {
            background: linear-gradient(rgba(0, 26, 53, 0.8), rgba(0, 86, 179, 0.9)), url('https://images.unsplash.com/photo-1552674605-15c2145f8ca4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') center/cover;
            padding: 80px 20px;
            text-align: center;
            color: var(--white);
            border-bottom: 5px solid var(--accent);
        }
        .page-header h1 {
            font-family: 'Montserrat';
            font-weight: 800;
            font-size: 3em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .page-header p {
            font-size: 1.1em;
            font-weight: 600;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Content Layout --- */
        .pr-container {
            max-width: 1300px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* --- Filter Dropdown (Consistent with Media Pages) --- */
        .filter-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .year-dropdown {
            font-family: 'Montserrat';
            font-weight: 700;
            font-size: 1.1em;
            color: var(--primary);
            padding: 12px 30px;
            border: 2px solid var(--primary);
            border-radius: 50px;
            background: white;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%230056b3%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
            padding-right: 40px;
        }
        .year-dropdown:hover, .year-dropdown:focus {
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
        }

        /* --- Press Release Cards --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .pr-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .pr-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .pr-date {
            font-size: 0.8em;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pr-title {
            font-family: 'Montserrat';
            font-size: 1.2em;
            color: var(--text-dark);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .pr-excerpt {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 25px;
            flex-grow: 1; /* Pushes the button to the bottom evenly */
        }

        .pr-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .btn-download {
            background: #f1f5f9;
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            font-family: 'Montserrat';
            font-size: 0.8em;
            text-decoration: none;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-download:hover {
            background: var(--primary);
            color: white;
        }

        .file-size {
            font-size: 0.75em;
            color: #94a3b8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>
    <script src="navbar.js"></script>

    <header class="page-header">
        <h1>Press Releases</h1>
        <p>Official announcements, team selections, and statements from TAA.</p>
    </header>

    <div class="pr-container">
        <div class="filter-container">
            <select id="prYearFilter" class="year-dropdown" onchange="filterPressReleases()">
                </select>
        </div>

        <div class="grid" id="prGrid">
            </div>
    </div>

    <script>
        // Mock Database of Press Releases Synced to Calendar Years
        const pressReleases = [
            { 
                title: "TAA Announces State Team for National Inter-State Championships", 
                date: "May 15, 2026", 
                categoryYear: "2026", 
                excerpt: "The Telangana Athletics Association has officially declared the 45-member squad that will represent the state at the upcoming National Inter-State Senior Athletics Championships in June.",
                size: "1.2 MB",
                file: "#"
            },
            { 
                title: "Launch of the New Unified Digital Athletics Portal", 
                date: "March 10, 2026", 
                categoryYear: "2026", 
                excerpt: "In a historic step forward, TAA unveils its centralized digital portal allowing athletes, coaches, and technical officials to register and track performances in real-time.",
                size: "845 KB",
                file: "#"
            },
            { 
                title: "State Meet Venue Shifted to Hanumakonda", 
                date: "February 02, 2026", 
                categoryYear: "2026", 
                excerpt: "Due to ongoing track renovations in Hyderabad, the upcoming State Athletics Championships scheduled for April have been officially relocated to the Jawaharlal Nehru Stadium in Hanumakonda.",
                size: "420 KB",
                file: "#"
            },
            { 
                title: "Selection Guidelines for South Zone Junior Athletics", 
                date: "September 18, 2025", 
                categoryYear: "2025", 
                excerpt: "The executive committee has released the official qualification standards and trial dates for the South Zone Junior Athletics Championships. All affiliated district secretaries must note the entry deadlines.",
                size: "2.1 MB",
                file: "#"
            },
            { 
                title: "TAA Celebrates National Javelin Day with Grassroots Program", 
                date: "August 07, 2025", 
                categoryYear: "2025", 
                excerpt: "To commemorate Neeraj Chopra's historic Olympic Gold, TAA has launched a massive grassroots talent identification program specifically targeting throwing events across all 33 districts.",
                size: "1.5 MB",
                file: "#"
            },
            { 
                title: "Annual General Body Meeting Resolutions", 
                date: "January 20, 2025", 
                categoryYear: "2025", 
                excerpt: "Key resolutions passed during the AGM include increased funding for coaching clinics, adoption of the new digital timing system, and the appointment of new district technical committees.",
                size: "3.4 MB",
                file: "#"
            }
        ];

        // Populate the 2000-2100 dropdown
        function populatePRYears() {
            let options = "";
            const currentYear = 2026; 
            for (let yr = 2000; yr <= 2100; yr++) {
                const selected = (yr === currentYear) ? "selected" : "";
                options += `<option value="${yr}" ${selected}>Season: ${yr}</option>`;
            }
            document.getElementById('prYearFilter').innerHTML = options;
        }

        // Filter Grid based on selected year
        function filterPressReleases() {
            const selectedYear = document.getElementById('prYearFilter').value;
            const grid = document.getElementById('prGrid');
            grid.innerHTML = '';

            const filteredPRs = pressReleases.filter(pr => pr.categoryYear === selectedYear);

            if (filteredPRs.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b; font-weight: 700; font-size: 1.2em; padding: 40px 0;">No press releases published for this season yet.</p>';
                return;
            }

            filteredPRs.forEach(pr => {
                grid.innerHTML += `
                    <div class="pr-card">
                        <div class="pr-date">📅 ${pr.date}</div>
                        <h3 class="pr-title">${pr.title}</h3>
                        <p class="pr-excerpt">${pr.excerpt}</p>
                        <div class="pr-footer">
                            <a href="${pr.file}" class="btn-download" onclick="alert('Downloading Official PDF...')">📄 Read Release</a>
                            <span class="file-size">PDF (${pr.size})</span>
                        </div>
                    </div>
                `;
            });
        }

        // Initialize Page
        window.onload = () => {
            populatePRYears();
            filterPressReleases();
        };

    </script>
</body>
</html>
