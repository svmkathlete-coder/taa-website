<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.jpg">
    <meta name="description" content="Athlete, coach or official profile on the Telangana Athletics Association website.">
    <meta property="og:site_name" content="Telangana Athletics Association">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Athlete Profile - TAA">
    <meta property="og:description" content="Athlete, coach or official profile on the Telangana Athletics Association website.">
    <title>Athlete Profile - TAA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <script type="module" src="firebase-init.js"></script>

    <style>
        :root { --primary: #0056b3; --accent: #FF8C00; --bg: #f4f7f6; }
        body { font-family: 'Open Sans', sans-serif; background: var(--bg); margin: 0; color: #333; }
        
        .profile-header { background: linear-gradient(135deg, var(--primary), #001a35); color: white; padding: 60px 20px; text-align: center; }
        .profile-avatar { width: 120px; height: 120px; background: white; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 3.5em; color: var(--primary); font-weight: 800; border: 5px solid rgba(255,255,255,0.1); text-transform: uppercase; }
        .profile-header h1 { font-family: 'Montserrat'; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .event-tag { display: inline-block; background: var(--accent); color: white; padding: 5px 15px; border-radius: 50px; font-size: 0.85em; font-weight: 800; margin-top: 10px; }

        .container { max-width: 1000px; margin: -40px auto 60px; padding: 0 20px; }
        .card { background: white; border-radius: 15px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 30px; }
        
        h2 { font-family: 'Montserrat'; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-top: 0; font-size: 1.2em; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; margin-top: 20px; }
        .info-item label { display: block; font-family: 'Montserrat'; font-weight: 800; color: #64748b; font-size: 0.7em; text-transform: uppercase; margin-bottom: 5px; }
        .info-item span { font-size: 1em; font-weight: 600; color: #1e293b; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-box { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .stat-box .val { display: block; font-size: 1.5em; font-weight: 800; color: var(--primary); font-family: 'Montserrat'; }
        .stat-box .lbl { font-size: 0.7em; font-weight: 800; color: #64748b; text-transform: uppercase; }

        .table-wrapper { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th { text-align: left; background: #f8fafc; padding: 12px; font-family: 'Montserrat'; font-size: 0.7em; color: #64748b; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.85em; font-weight: 600; }
        
        .pos-badge { background: var(--primary); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.8em; font-weight: 800; }

        .back-btn { display: inline-block; margin-bottom: 20px; color: white; text-decoration: none; font-weight: 700; font-size: 0.9em; transition: 0.2s; cursor: pointer; }
        .back-btn:hover { opacity: 0.8; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="navbar-container"></div>
    <script src="navbar.js"></script>

    <div id="profilePage">
        <div style="text-align:center; padding:100px;">
            <h2 style="color:var(--text-muted);">Fetching Profile Data...</h2>
        </div>
    </div>

    <script type="module">
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            // Support both 'id' (from home page) and 'uid' (from profiles grid)
            const uidParam = urlParams.get('id') || urlParams.get('uid'); 
            const from = urlParams.get('from');
            const ref = urlParams.get('ref');
            
            // --- SMART BACK BUTTON LOGIC ---
            let backUrl = "profiles.html";
            let backText = "← Back to Directory";
            
            if (from === "home") {
                backUrl = "index.html";
                backText = "← Back to Home";
            } else if (ref === "rankings") {
                backUrl = "rankings.html";
                backText = "← Back to Rankings";
            }

            let user = null;

            // --- 1. FETCH FROM CLOUD DATABASE ---
            // public_profiles is the world-readable, safe-to-show subset. This page
            // is public, so it must never query the private `users` collection (which
            // is locked to its owner/Admin anyway, and holds sensitive fields like DOB,
            // father's name, and blood group that don't belong on a public page).
            if (uidParam) {
                try {
                    if (window.db) {
                        const q = query(collection(window.db, "public_profiles"), where("afi_uid", "==", uidParam.toUpperCase()));
                        const snap = await getDocs(q);

                        if (!snap.empty) {
                            const data = snap.docs[0].data();
                            user = {
                                uid: data.afi_uid || "PENDING",
                                name: data.full_name || "Unknown",
                                role: data.role || "Athlete",
                                dist: data.district || "N/A",
                                event: data.event || data.specialty || "Athletics",
                                coachingPlace: data.coaching_place || "N/A",
                                level: data.level || "N/A",
                                pb: data.pb || "N/A",
                                sb: data.sb || "N/A",
                                rank: data.rank || "Unranked",
                                history: data.history || [] // Array of past meets if available in cloud
                            };
                        }
                    }
                } catch (error) {
                    console.warn("Cloud fetch error:", error);
                }
            }

            const display = document.getElementById('profilePage');
            
            // --- 3. ERROR HANDLING ---
            if (!user) {
                display.innerHTML = `
                    <div style='text-align:center; padding:100px;'>
                        <h1 style="font-family: 'Montserrat'; color: var(--primary); margin-bottom: 20px;">Profile Not Found</h1>
                        <p style="color: #64748b; margin-bottom: 20px;">This UID may be incorrect or the profile is pending verification.</p>
                        <a href='${backUrl}' style="color: var(--accent); font-weight: 700; text-decoration: none; font-size: 1.1em;">${backText}</a>
                    </div>`;
                return;
            }

            // Safe Masking (Accounts for shorter "PENDING" strings)
            const maskedUID = user.uid.length > 7 ? user.uid.substring(0, 7) + "****" : user.uid;
            const initial = user.name ? user.name.charAt(0) : "A";

            // --- 4. RENDER UI ---
            display.innerHTML = `
                <div class="profile-header">
                    <div class="container" style="margin:0 auto; text-align:left;">
                        <a href="${backUrl}" class="back-btn">${backText}</a>
                    </div>
                    <div class="profile-avatar">${initial}</div>
                    <h1>${user.name}</h1>
                    <div class="event-tag">${user.event || user.role}</div>
                </div>

                <div class="container">
                    <div class="card">
                        <h2>Personal Details</h2>
                        <div class="info-grid">
                            <div class="info-item"><label>Full Name</label><span>${user.name}</span></div>
                            <div class="info-item"><label>AFI UID (Masked)</label><span>${maskedUID}</span></div>
                            <div class="info-item"><label>Role</label><span>${user.role}</span></div>
                            <div class="info-item"><label>District Affiliation</label><span>${user.dist}</span></div>
                            ${user.role === "Coach" || user.role === "Official" ? `<div class="info-item"><label>Level</label><span>${user.level || 'N/A'}</span></div>` : ''}
                            ${user.role === "Coach" ? `<div class="info-item"><label>Coaching Base</label><span>${user.coachingPlace || 'N/A'}</span></div>` : ''}
                        </div>
                    </div>

                    <div class="card">
                        <h2>Performance Highlights</h2>
                        <div class="stats-row">
                            <div class="stat-box"><span class="val">${user.pb || 'N/A'}</span><span class="lbl">Personal Best</span></div>
                            <div class="stat-box"><span class="val">${user.sb || 'N/A'}</span><span class="lbl">Seasonal Best</span></div>
                            <div class="stat-box"><span class="val">${user.rank || 'N/A'}</span><span class="lbl">Current Ranking</span></div>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Competition History</h2>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Competition Name</th>
                                        <th>Venue</th>
                                        <th>Performance</th>
                                        <th>Position</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${(user.history && user.history.length > 0) ? user.history.map(h => `
                                        <tr>
                                            <td style="color:#64748b; font-size:0.85em;">${h.date}</td>
                                            <td>${h.meet}</td>
                                            <td>${h.venue}</td>
                                            <td style="color:var(--primary); font-weight:800;">${h.perf}</td>
                                            <td><span class="pos-badge">${h.pos}</span></td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="5" style="text-align:center; padding: 30px; color:#64748b;">No verified competition records found in the database.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>

    <div id="footer-container"></div>
</body>
</html>
