<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login - TAA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <script type="module" src="firebase-init.js"></script>
    <script type="module" src="auth.js"></script>

    <style>
        :root { --primary: #0056b3; --accent: #FF8C00; --bg: #f8fafc; --text: #334155; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, rgba(0,26,53,0.95), rgba(0,86,179,0.9)),
                        url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-page-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .login-wrapper { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center; position: relative; overflow: hidden; }
        .logo { width: 70px; margin-bottom: 15px; }
        h2 { font-family: 'Montserrat'; color: #0f172a; font-size: 1.4em; margin-bottom: 5px; text-transform: uppercase; }
        p.subtitle { color: #64748b; font-size: 0.85em; margin-bottom: 25px; line-height: 1.4; }

        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 700; font-size: 0.75em; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-family: 'Open Sans'; font-size: 0.95em; outline: none; transition: 0.2s; font-weight: 600; color: #1e293b; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,86,179,0.1); }

        .password-wrapper { position: relative; display: flex; align-items: center; }
        .toggle-password-btn { position: absolute; right: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; display: flex; align-items: center; }
        .toggle-password-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-family: 'Montserrat'; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
        .btn-primary:hover { background: #004494; transform: translateY(-2px); }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        .links-grid { display: flex; justify-content: space-between; margin-top: 20px; font-size: 0.8em; font-weight: 700; }
        .links-grid a { color: var(--primary); text-decoration: none; }

        .error-msg { color: #ef4444; font-size: 0.8em; margin-top: 15px; font-weight: 700; display: none; background: #fee2e2; padding: 10px; border-radius: 6px; }
        .info-msg { color: #0369a1; font-size: 0.8em; margin-top: 15px; font-weight: 700; display: none; background: #e0f2fe; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="navbar-container"></div>
    <script src="navbar.js"></script>

    <div class="login-page-container">
        <div class="login-wrapper">
            <img src="LOGO.jfif" alt="TAA Logo" class="logo">

            <h2>Secure Portal</h2>
            <p class="subtitle">Unified Login for Athletics Community</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="emailInput" class="form-control" placeholder="you@example.com" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePassword()">
                            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div id="loginError" class="error-msg"></div>
                <div id="loginInfo" class="info-msg"></div>
                <button id="loginBtn" type="submit" class="btn-primary">Login</button>

                <div class="links-grid">
                    <a href="#" onclick="window.toggleReset(event)">Forgot Password?</a>
                    <a href="athlete-registration.html">New here? Register</a>
                </div>
            </form>

            <form id="resetForm" style="display:none; text-align:left; margin-top:20px; border-top: 1px solid #e2e8f0; padding-top:20px;">
                <p class="subtitle" style="margin-bottom:15px;">Enter your account email and we'll send you a secure link to reset your password.</p>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="resetEmailInput" class="form-control" placeholder="you@example.com" required>
                </div>
                <div id="resetError" class="error-msg"></div>
                <div id="resetInfo" class="info-msg"></div>
                <button id="resetBtn" type="submit" class="btn-primary">Send Reset Link</button>
                <div class="links-grid" style="justify-content:center; margin-top:15px;">
                    <a href="#" onclick="window.toggleReset(event)">← Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        window.togglePassword = function() {
            const p = document.getElementById('passwordInput');
            p.type = p.type === 'password' ? 'text' : 'password';
        };

        window.toggleReset = function(e) {
            e.preventDefault();
            const loginForm = document.getElementById('loginForm');
            const resetForm = document.getElementById('resetForm');
            const showingReset = resetForm.style.display === 'none';
            loginForm.style.display = showingReset ? 'none' : 'block';
            resetForm.style.display = showingReset ? 'block' : 'none';
        };

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('resetEmailInput').value.trim();
            const errorBox = document.getElementById('resetError');
            const infoBox = document.getElementById('resetInfo');
            const btn = document.getElementById('resetBtn');

            errorBox.style.display = 'none';
            infoBox.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Sending...";

            try {
                await window.TAA_AUTH.resetPassword(email);
                infoBox.innerText = "If that email is registered, a reset link has been sent. Check your inbox (and spam folder).";
                infoBox.style.display = 'block';
            } catch (err) {
                console.error("Reset error:", err);
                errorBox.innerText = window.TAA_AUTH.friendlyError(err);
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Send Reset Link";
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorBox = document.getElementById('loginError');
            const infoBox = document.getElementById('loginInfo');
            const btn = document.getElementById('loginBtn');

            errorBox.style.display = 'none';
            infoBox.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Signing in...";

            try {
                const profile = await window.TAA_AUTH.login(email, password);

                if (profile.status === "Pending") {
                    infoBox.innerText = "Your registration is awaiting TAA admin approval. You'll be notified by email once verified.";
                    infoBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "Login";
                    return;
                }
                if (profile.status === "Rejected" || profile.status === "Suspended") {
                    errorBox.innerText = "Your account is not active. Please contact the TAA office.";
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "Login";
                    return;
                }

                window.location.href = window.TAA_AUTH.dashboardFor(profile.role);
            } catch (err) {
                console.error("Login error:", err);
                errorBox.innerText = window.TAA_AUTH.friendlyError(err);
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "Login";
            }
        });
    </script>

    <div id="footer-container"></div>
</body>
</html>
