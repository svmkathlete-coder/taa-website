<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Unified Login - TAA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <script type="module" src="firebase-init.js"></script>

    <style>
        :root { --primary: #0056b3; --accent: #FF8C00; --bg: #f8fafc; --text: #334155; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            background: linear-gradient(135deg, rgba(0,26,53,0.95), rgba(0,86,179,0.9)), 
                        url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-page-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .login-wrapper { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center; position: relative; overflow: hidden; }
        .logo { width: 70px; margin-bottom: 15px; }
        h2 { font-family: 'Montserrat'; color: #0f172a; font-size: 1.4em; margin-bottom: 5px; text-transform: uppercase; }
        p.subtitle { color: #64748b; font-size: 0.85em; margin-bottom: 25px; line-height: 1.4; }

        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 700; font-size: 0.75em; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-family: 'Open Sans'; font-size: 0.95em; outline: none; transition: 0.2s; font-weight: 600; color: #1e293b; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,86,179,0.1); }

        .password-wrapper { position: relative; display: flex; align-items: center; }
        .toggle-password-btn { position: absolute; right: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; display: flex; align-items: center; }
        .toggle-password-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .captcha-box { display: flex; gap: 10px; align-items: center; }
        .captcha-display { background: #f1f5f9; padding: 10px 20px; border-radius: 8px; font-family: 'Courier New', monospace; font-weight: 800; font-size: 1.2em; color: var(--primary); letter-spacing: 4px; user-select: none; }
        
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-family: 'Montserrat'; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
        .btn-primary:hover { background: #004494; transform: translateY(-2px); }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

        .links-grid { display: flex; justify-content: space-between; margin-top: 20px; font-size: 0.8em; font-weight: 700; }
        .links-grid a { color: var(--primary); text-decoration: none; }

        .error-msg { color: #ef4444; font-size: 0.8em; margin-top: 15px; font-weight: 700; display: none; background: #fee2e2; padding: 10px; border-radius: 6px; }

        #step-otp { display: none; }
        .otp-msg { background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 8px; font-size: 0.85em; font-weight: 600; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="navbar-container"></div>
    <script src="navbar.js"></script>

    <div class="login-page-container">
        <div class="login-wrapper">
            <img src="LOGO.jfif" alt="TAA Logo" class="logo">
            
            <div id="step-login">
                <h2>Secure Portal</h2>
                <p class="subtitle">Unified Login for Athletics Community</p>

                <div class="form-group">
                    <label>AFI UID / Email</label>
                    <input type="text" id="userId" class="form-control" placeholder="e.g. AFI20261001" autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="••••••••">
                        <button type="button" class="toggle-password-btn" onclick="togglePassword()">
                            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Security CAPTCHA</label>
                    <div class="captcha-box">
                        <div class="captcha-display" id="captchaText">...</div>
                        <button class="form-control" style="width: 50px; padding: 5px;" onclick="generateCaptcha()">🔄</button>
                        <input type="text" id="captchaInput" class="form-control" placeholder="Text">
                    </div>
                </div>

                <div id="loginError" class="error-msg"></div>
                <button id="loginBtn" class="btn-primary" onclick="verifyCredentials()">Login</button>

                <div class="links-grid">
                    <a href="recovery.html">Forgot ID?</a>
                    <a href="recovery.html">Forgot Password?</a>
                </div>
            </div>

            <div id="step-otp">
                <h2>2-Step Verification</h2>
                <p class="subtitle">Authentication Required</p>
                <div class="otp-msg">A 6-digit OTP has been sent to your registered email: <br><strong id="targetEmail">...</strong></div>
                <div class="form-group">
                    <label>Enter 6-Digit OTP</label>
                    <input type="text" id="otpInput" class="form-control" placeholder="· · · · · ·" maxlength="6" style="text-align: center; font-size: 1.5em; letter-spacing: 5px;">
                </div>
                <div id="otpError" class="error-msg"></div>
                <button id="otpBtn" class="btn-primary" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>
    </div>

   <script type="module">
    import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    let currentCaptcha = "";
    let authenticatedUser = null;
    let generatedOTP = "";

    // 1. Initialize Page
    window.generateCaptcha = function() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; 
        currentCaptcha = Array.from({length: 5}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
        document.getElementById('captchaText').innerText = currentCaptcha;
    };

    window.togglePassword = function() {
        const p = document.getElementById('password');
        p.type = p.type === 'password' ? 'text' : 'password';
    };

    // 2. Step 1: Verify User in Firebase
    window.verifyCredentials = async function() {
        const uidInput = document.getElementById('userId').value.trim().toUpperCase();
        const passInput = document.getElementById('password').value;
        const captchaInput = document.getElementById('captchaInput').value.trim().toUpperCase();
        const errorBox = document.getElementById('loginError');
        const btn = document.getElementById('loginBtn');

        errorBox.style.display = 'none';

        if (captchaInput !== currentCaptcha) {
            errorBox.innerText = "Invalid CAPTCHA.";
            errorBox.style.display = 'block';
            generateCaptcha();
            return;
        }

        btn.disabled = true;
        btn.innerText = "Checking...";

        try {
            // -- EMERGENCY & ADMIN OVERRIDES (No Firebase needed for these) --
            if (uidInput === "TAA-ADMIN-0001" || uidInput === "TAA_ADMIN") {
                if (passInput !== "admin123") throw new Error("Invalid Admin Password");
                authenticatedUser = { id: "master", fullName: "System Admin", role: "Admin", email: "admin@taa.in", afi_uid: "TAA-ADMIN-0001" };
                sendOTP();
                return;
            }
            if (uidInput === "TAA-TECH-001" || uidInput === "TECH_CHAIR") {
                if (passInput !== "tech123") throw new Error("Invalid Chairman Password");
                authenticatedUser = { id: "master", fullName: "Technical Chairman", role: "Technical Chairman", email: "tech@taa.in", afi_uid: "TAA-TECH-001" };
                sendOTP();
                return;
            }

            // -- FIREBASE CONNECTION CHECK --
            if (!window.db) {
                throw new Error("Database offline. Please check firebase-init.js connection.");
            }

            // -- SEARCH REAL USERS --
            const q = query(collection(window.db, "users"), where("afi_uid", "==", uidInput));
            const querySnapshot = await getDocs(q);
            
            let userDoc = null;
            querySnapshot.forEach(d => { userDoc = { id: d.id, ...d.data() }; });

            if (userDoc && userDoc.password === passInput) {
                authenticatedUser = userDoc;
                sendOTP();
            } else {
                throw new Error("Invalid User ID or Password.");
            }
        } catch (err) {
            errorBox.innerText = err.message;
            errorBox.style.display = 'block';
            btn.disabled = false;
            btn.innerText = "Login";
            generateCaptcha();
        }
    };

    // 3. Send OTP via EmailJS
    async function sendOTP() {
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        const btn = document.getElementById('loginBtn');

        try {
            // Update Firestore with OTP (if it's not a hardcoded admin)
            if (authenticatedUser.id !== "master" && window.db) {
                const userRef = doc(window.db, "users", authenticatedUser.id);
                await updateDoc(userRef, { current_otp: generatedOTP });
            }

            // Fire EmailJS Notification
            if (window.emailjs) {
                await window.emailjs.send(window.EMAIL_SERVICE_ID, window.EMAIL_TEMPLATE_ID, {
                    subject: "Login Verification Code",
                    name: authenticatedUser.first_name || authenticatedUser.fullName || "User",
                    message: `Your TAA Portal secure login code is: ${generatedOTP}.`
                });
            } else {
                console.warn("EmailJS not loaded. Bypassing OTP for testing.");
            }

            // Show UI Masked Email
            const email = authenticatedUser.email || "user@taa.in";
            document.getElementById('targetEmail').innerText = email.replace(/(.{3})(.*)(?=@)/, "$1****");
            document.getElementById('step-login').style.display = 'none';
            document.getElementById('step-otp').style.display = 'block';

        } catch (err) {
            console.error("OTP Error:", err);
            // Fallback for local testing so you don't get stuck
            alert(`[TESTING MODE] Email failed to send. Your OTP is: ${generatedOTP}`);
            document.getElementById('step-login').style.display = 'none';
            document.getElementById('step-otp').style.display = 'block';
        }
    }

    // 4. Final Verification and Specific Role Routing
    window.verifyOTP = function() {
        const input = document.getElementById('otpInput').value.trim();
        const errorBox = document.getElementById('otpError');

        if (input === generatedOTP) {
            // Save Session for Security Checks
            sessionStorage.setItem('taa_logged_user', JSON.stringify(authenticatedUser));
            
            // Normalize role to lowercase for safe checking
            const role = (authenticatedUser.role || authenticatedUser.regType || "").toLowerCase();

            // --- 6-WAY SPECIFIC ROUTING ---
            if (role === "admin" || role === "taa-admin") {
                window.location.href = "taa-admin.html";
            } 
            else if (role === "technical chairman" || role === "technical") {
                window.location.href = "technical-chairman.html";
            } 
            else if (role === "district" || role === "member association") {
                window.location.href = "district-dashboard.html";
            } 
            else if (role === "coach") {
                window.location.href = `coach-dashboard.html?uid=${authenticatedUser.afi_uid}`;
            } 
            else if (role === "official") {
                window.location.href = `official-dashboard.html?uid=${authenticatedUser.afi_uid}`;
            } 
            else {
                // Default to Athlete
                window.location.href = `athlete-dashboard.html?uid=${authenticatedUser.afi_uid}`;
            }
        } else {
            errorBox.innerText = "Incorrect OTP. Please check your email.";
            errorBox.style.display = 'block';
        }
    };

    window.onload = generateCaptcha;
</script>

    <div id="footer-container"></div>
</body>
</html>
