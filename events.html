<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Calendar - Telangana Athletics Association</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #35CAFE;
            --accent: #FF8C00;
            --white: #ffffff;
            --dark-blue: #001a35;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            background: linear-gradient(rgba(244, 247, 246, 0.96), rgba(244, 247, 246, 0.96)),
                        url('https://www.transparenttextures.com/patterns/carbon-fibre.png'),
                        #f4f7f6;
            color: #333; 
            line-height: 1.6; 
        }

        /* --- Navigation Styles for navbar.js --- */
        .navbar {
            background: var(--white);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 9999;
            padding: 5px 0;
        }
        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-logo img { width: 55px; height: 55px; }
        .logo-text { display: flex; flex-direction: column; }
        .main-title { color: var(--primary); font-weight: 800; font-size: 1.1em; line-height: 1; font-family: 'Montserrat'; }
        .sub-title { color: #64748b; font-weight: 600; font-size: 0.75em; letter-spacing: 1px; }

        .nav-menu { display: flex; list-style: none; gap: 15px; align-items: center; margin: 0; padding: 0; }
        .nav-menu li { position: relative; }
        .nav-menu a { 
            text-decoration: none; color: #1a1a1a; font-weight: 700; 
            font-size: 0.82em; transition: 0.3s; padding: 15px 5px;
            font-family: 'Montserrat'; text-transform: uppercase;
        }
        .nav-menu a:hover, .nav-menu a.active { color: var(--accent); }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--white);
            min-width: 220px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            top: 100%; left: 0;
            border-top: 3px solid var(--accent);
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: #333; padding: 12px 16px; display: block; text-transform: none; font-size: 0.85em; border-bottom: 1px solid #f1f1f1; }

        .ors-btn { background: var(--primary) !important; color: white !important; padding: 10px 22px !important; border-radius: 50px; margin-left: 10px; }

        /* --- Hero Banner --- */
        .hero { 
            background: linear-gradient(135deg, #0056b3 0%, var(--dark-blue) 100%); 
            color: white; 
            padding: 60px 20px; 
            text-align: center; 
        }
        .hero h1 { font-family: 'Montserrat'; font-size: 2.2em; text-transform: uppercase; margin-bottom: 5px; }
        .hero p { opacity: 0.9; font-weight: 600; font-size: 0.9em; letter-spacing: 1px; }

        /* --- Filter Section --- */
        .filter-section {
            max-width: 1100px;
            margin: 20px auto 0;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .filter-label { font-family: 'Montserrat'; font-weight: 800; color: var(--primary); font-size: 0.9em; }
        .year-select {
            padding: 8px 25px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-family: 'Montserrat';
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            background: white;
            outline: none;
        }

        /* --- Event Cards --- */
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        .event-card {
            background: white;
            border-radius: 12px;
            display: flex;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        .event-date {
            background: var(--accent);
            color: white;
            padding: 25px;
            min-width: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat';
            text-align: center;
        }
        .event-date .month { font-size: 1.2em; font-weight: 800; text-transform: uppercase; }
        .event-date .year { font-size: 1.1em; opacity: 0.9; }

        .event-details { padding: 25px; flex-grow: 1; }
        .event-details h3 { font-family: 'Montserrat'; color: var(--primary); margin-bottom: 12px; font-size: 1.05em; line-height: 1.4; }
        
        .event-info { display: flex; flex-wrap: wrap; gap: 20px; font-size: 0.85em; color: #64748b; font-weight: 600; }
        .info-item { display: flex; align-items: center; gap: 6px; }

        /* --- Maps Redirection Hover --- */
        .venue-link {
            text-decoration: none;
            color: inherit;
            transition: 0.2s;
        }
        .venue-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            border: 2px dashed #ddd;
        }

        @media (max-width: 768px) {
            .event-card { flex-direction: column; }
            .event-date { padding: 15px; min-width: 100%; flex-direction: row; gap: 10px; }
            .nav-menu { display: none; }
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>
    <script src="navbar.js"></script>

    <header class="hero">
        <h1>COMPETITION CALENDAR 2026-27</h1>
        <p>Official Tentative Schedule of Telangana Athletics Association</p>
    </header>

    <div class="filter-section">
        <span class="filter-label">SELECT YEAR:</span>
        <select class="year-select" id="yearFilter" onchange="loadDynamicContent()">
        </select>
    </div>

    <div class="container" id="eventsContainer">
    </div>

    <script>
        const masterData = [
            { categoryYear: "2026", title: "1. State Meet for Relay Teams", venue: "Hanumakonda", date: "MAR 2026", fullDate: "March 15, 2026" },
            { categoryYear: "2026", title: "2. State Athletics Championships for Federation Cup (U-20, Men, Women & Combined Events)", venue: "Mulugu/Hanumakonda", date: "APR 2026", fullDate: "April 11 - 12, 2026" },
            { categoryYear: "2026", title: "3. State Athletics Championship for All Age Groups(Jumps and Throws)", venue: "Jangaon", date: "MAY 2026", fullDate: "May 10, 2026" },
            { categoryYear: "2026", title: "4. State Athletics Sub-Jr, Juniors & All Age Group Athletics Championships", venue: "Gaudium School, Hyderabad", date: "MAY 2026", fullDate: "May 31, 2026" },
            { categoryYear: "2026", title: "5. State Sub-Jr, Juniors (U12 to U20) & Men Athletics Championships", venue: "Badradri Kothagudem", date: "JUN 2026", fullDate: "June 06 - 07, 2026" },
            { categoryYear: "2026", title: "6. State Championships for Inter-State Nationals(Men & Women) & U16, U18, U20", venue: "Osmania University, Hyderabad", date: "JUN 2026", fullDate: "June 27 - 28, 2026" },
            { categoryYear: "2026", title: "7. State All Age Groups Middle & Long Distance Championship and Triathlon A,B,C", venue: "Medak", date: "JUL 2026", fullDate: "July 19, 2026" },
            { categoryYear: "2026", title: "8. National Javelin Day & South Zone Junior Championship & Youth Championship", venue: "Hanumakonda/Khammam", date: "AUG 2026", fullDate: "August 07 - 08, 2026" },
            { categoryYear: "2026", title: "9. Indian Athletics Series-13 (Seniors & Juniors)", venue: "Hanumakonda", date: "AUG 2026", fullDate: "August 14, 2026" },
            { categoryYear: "2026", title: "10. Telangana State Junior Athletics Championships & Men and Women Athletics Championship & U23 Athletics Championship", venue: "WGL at JNS", date: "SEP 2026", fullDate: "September 19 - 21, 2026" },
            { categoryYear: "2026", title: "11. Coaching Camp for Jr.Nationals, Open Nationals and U-23 Men & Women", venue: "Hanumakonda", date: "SEP 2026", fullDate: "Sept 27 - Oct 21, 2026" },
            { categoryYear: "2026", title: "12. State Sub-Jr Athletics Championships (10, 12, 14 Age groups)", venue: "Komurambheem Asifabad", date: "OCT 2026", fullDate: "October 04, 2026" },
            { categoryYear: "2026", title: "13. State Sub-Jr & Juniors Open Athletics Championships", venue: "Nizamabad", date: "NOV 2026", fullDate: "November 21 - 22, 2026" },
            { categoryYear: "2026", title: "14. State Sub Jr. and Junior Athletics Championships(8, 10, 12, 14, 16, 18, 20 Age groups)", venue: "Bhupalapally", date: "DEC 2026", fullDate: "December 6 - 7, 2026" },
            { categoryYear: "2026", title: "15. State Selection Trials for Cross Country Nationals", venue: "Narayanpet", date: "DEC 2026", fullDate: "December 20, 2026" },
            { categoryYear: "2026", title: "16. State Relay Championships for All Age groups (4x100, 4x400, 4x100 Mixed, 4x400 Mixed)", venue: "IIT Hyderabad", date: "JAN 2027", fullDate: "January 10, 2027" },
            { categoryYear: "2026", title: "17. State Sub Juniors and Juniors Athletics Championship", venue: "Karimnagar", date: "FEB 2027", fullDate: "February 07, 2027" }
        ];

        function populateYears() {
            const selector = document.getElementById('yearFilter');
            let options = "";
            for (let yr = 2000; yr <= 2100; yr++) {
                const selected = (yr === 2026) ? "selected" : "";
                options += `<option value="${yr}" ${selected}>${yr}</option>`;
            }
            selector.innerHTML = options;
        }

        function loadDynamicContent() {
            const container = document.getElementById('eventsContainer');
            const selectedYear = document.getElementById('yearFilter').value;
            const filtered = masterData.filter(item => item.categoryYear === selectedYear);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3 style="font-family:Montserrat; color:#64748b;">No events scheduled for ${selectedYear}</h3>
                        <p style="color:#94a3b8; font-size:0.9em; margin-top:5px;">Check back later for updates on the ${selectedYear} season.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(meet => {
                // --- MAPS REDIRECTION LOGIC ---
                const mapSearchUrl = `https://www.google.com/maps/search/${encodeURIComponent(meet.venue)}`;
                
                return `
                <div class="event-card">
                    <div class="event-date">
                        <span class="month">${meet.date.split(' ')[0]}</span>
                        <span class="year">${meet.date.split(' ')[1]}</span>
                    </div>
                    <div class="event-details">
                        <h3>${meet.title}</h3>
                        <div class="event-info">
                            <div class="info-item">
                                <a href="${mapSearchUrl}" target="_blank" class="venue-link">
                                    📍 ${meet.venue}
                                </a>
                            </div>
                            <div class="info-item">🗓️ ${meet.fullDate}</div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        window.onload = () => {
            populateYears();
            loadDynamicContent();
        };
    </script>
</body>
</html>
