<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAA Master Admin - Performance Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <script type="module" src="firebase-init.js"></script>

    <style>
        body { font-family: 'Open Sans', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid #0056b3; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h2 { font-family: 'Montserrat', sans-serif; color: #0056b3; text-transform: uppercase; margin: 0; }
        
        /* Automation Panel */
        .automation-panel { background: #eef7ff; padding: 20px; border-radius: 10px; border: 2px dashed #0056b3; margin-bottom: 30px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
        .automation-panel p { margin: 0; font-size: 0.9em; color: #0056b3; font-weight: 600; }

        .btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: 'Montserrat'; text-transform: uppercase; font-size: 0.8em; transition: 0.3s; }
        .btn-excel { background: #27ae60; color: white; }
        .btn-clear { background: #e63946; color: white; }
        .btn-view { background: #35CAFE; color: white; padding: 5px 10px; font-size: 0.7em; }
        .btn-upload { background: #0056b3; color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #0056b3; color: white; padding: 15px; text-align: left; font-size: 0.8em; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.9em; vertical-align: top; }
        
        .detail-row { display: none; background: #f9f9f9; }
        .detail-container { padding: 20px; border: 2px solid #35CAFE; border-radius: 8px; margin: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .detail-item { font-size: 0.85em; color: #444; }
        .detail-item b { color: #0056b3; text-transform: uppercase; display: block; font-size: 0.75em; }
        
        .tag { padding: 3px 8px; border-radius: 4px; font-weight: 700; font-size: 0.75em; }
        .tag-athlete { background: #e3f2fd; color: #1976d2; }
        .tag-coach { background: #f3e5f5; color: #7b1fa2; }
        .tag-official { background: #fff3e0; color: #e65100; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h2>Master Registration Database</h2>
        <div>
            <button class="btn btn-excel" onclick="exportFullExcel()">Export Full Data</button>
            <button class="btn btn-clear" onclick="clearAll()">Clear Database</button>
        </div>
    </div>

    <div class="automation-panel">
        <div>
            <p>AUTOMATED COMPETITION RESULTS SYNC</p>
            <small>Upload CSV with columns: <b>uid, competition_name, level, event, venue, date, performance, measurement_type, position</b></small>
        </div>
        <div>
            <input type="file" id="csvFile" accept=".csv" style="font-size: 0.8em;">
            <button class="btn btn-upload" onclick="handleBulkUpload()">Sync Results</button>
        </div>
    </div>

    <table id="masterTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Full Name</th>
                <th>AFI ID / UID</th>
                <th>Type</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script type="module">
    import { collection, getDocs, writeBatch, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Attach functions to global window object so HTML inline onclick handlers still work
    window.loadData = loadData;
    window.handleBulkUpload = handleBulkUpload;
    window.toggleDetails = toggleDetails;
    window.exportFullExcel = exportFullExcel;
    window.clearAll = clearAll;

    async function loadData() {
        let combined = [];
        try {
            if (window.db) {
                const usersSnap = await getDocs(collection(window.db, "users"));
                const officialsSnap = await getDocs(collection(window.db, "officials"));
                usersSnap.forEach(d => combined.push(d.data()));
                officialsSnap.forEach(d => combined.push(d.data()));
            }
        } catch (error) {
            console.error("Firebase fetch error:", error);
            alert("Could not load data from the cloud.");
            return;
        }
        
        combined.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        const body = document.getElementById('tableBody');
        body.innerHTML = '';

        combined.forEach((item, index) => {
            const type = item.regType || 'Official';
            const rowId = 'details-' + index;
            const tagClass = 'tag-' + type.toLowerCase();
            const displayUID = item.afi_id || item.afi_uid || 'N/A';

            let html = `
                <tr>
                    <td>${item.timestamp || 'N/A'}</td>
                    <td><b>${item.first_name} ${item.last_name}</b></td>
                    <td><code>${displayUID}</code></td>
                    <td><span class="tag ${tagClass}">${type}</span></td>
                    <td>${item.level || item.event || 'Registered'}</td>
                    <td><button class="btn btn-view" onclick="toggleDetails('${rowId}')">Full Profile</button></td>
                </tr>
                <tr id="${rowId}" class="detail-row">
                    <td colspan="6">
                        <div class="detail-container">
                            <div class="detail-item"><b>Gender</b> ${item.gender || 'N/A'}</div>
                            <div class="detail-item"><b>DOB</b> ${item.dob || 'N/A'}</div>
                            <div class="detail-item"><b>Aadhaar</b> [Aadhaar Redacted]</div>
                            <div class="detail-item"><b>Mobile</b> ${item.mobile || 'N/A'}</div>
                            <div class="detail-item"><b>Email</b> ${item.email || 'N/A'}</div>
                            <div class="detail-item"><b>Father's Name</b> ${item.father_name || 'N/A'}</div>
                            <div class="detail-item"><b>Address</b> ${item.address || 'N/A'}</div>
                            <div class="detail-item"><b>District/Pincode</b> ${item.district || ''} - ${item.pincode || ''}</div>
                            <div class="detail-item"><b>Specialization</b> ${item.experience || item.specialty || item.event || 'N/A'}</div>
                        </div>
                    </td>
                </tr>
            `;
            body.innerHTML += html;
        });
    }

    function handleBulkUpload() {
        const fileInput = document.getElementById('csvFile');
        if (!fileInput.files[0]) return alert("Please select a results CSV file.");

        Papa.parse(fileInput.files[0], {
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                const newPerformanceData = results.data;
                
                const requiredCols = ['uid', 'competition_name', 'level', 'performance', 'measurement_type'];
                const headers = results.meta.fields;
                const missing = requiredCols.filter(c => !headers.includes(c));

                if (missing.length > 0) {
                    return alert("Error: Missing columns in CSV: " + missing.join(", "));
                }

                try {
                    if (window.db) {
                        const batch = writeBatch(window.db);
                        newPerformanceData.forEach(perf => {
                            const newDocRef = doc(collection(window.db, "results"));
                            batch.set(newDocRef, perf);
                        });
                        await batch.commit();
                        alert(`SUCCESS: ${newPerformanceData.length} performances synced with full competition metadata.`);
                        fileInput.value = ""; 
                    }
                } catch (error) {
                    console.error("Firebase sync failed:", error);
                    alert("Failed to sync results to the cloud.");
                }
            }
        });
    }

    function toggleDetails(id) {
        const row = document.getElementById(id);
        row.style.display = (row.style.display === 'table-row') ? 'none' : 'table-row';
    }

    async function exportFullExcel() {
        let combined = [];
        try {
            if (window.db) {
                const usersSnap = await getDocs(collection(window.db, "users"));
                const officialsSnap = await getDocs(collection(window.db, "officials"));
                usersSnap.forEach(d => combined.push(d.data()));
                officialsSnap.forEach(d => combined.push(d.data()));
            }
        } catch (error) {
            console.error("Firebase fetch error:", error);
            return alert("Failed to fetch data for export.");
        }

        if(combined.length === 0) return alert("No data!");

        let csv = "Timestamp,Type,First Name,Last Name,ID,DOB,Mobile,Email,District\n";
        combined.forEach(i => {
            csv += `"${i.timestamp || ''}","${i.regType || 'Official'}","${i.first_name || ''}","${i.last_name || ''}","${i.afi_id || i.afi_uid || ''}","${i.dob || ''}","${i.mobile || ''}","${i.email || ''}","${i.district || ''}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'TAA_Master_Database.csv';
        a.click();
    }

    async function clearAll() {
        if(confirm("DANGER: Wipe entire database?")) {
            try {
                if (window.db) {
                    const usersSnap = await getDocs(collection(window.db, "users"));
                    usersSnap.forEach(async (d) => await deleteDoc(doc(window.db, "users", d.id)));
                    const officialsSnap = await getDocs(collection(window.db, "officials"));
                    officialsSnap.forEach(async (d) => await deleteDoc(doc(window.db, "officials", d.id)));
                    alert("Database wiped successfully from the cloud.");
                }
            } catch (error) {
                console.error("Firebase wipe failed:", error);
                alert("Failed to wipe database.");
            }
            loadData();
        }
    }

    window.onload = loadData;
</script>
</body>
</html>
